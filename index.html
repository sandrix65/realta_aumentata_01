<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14203A">
  <title>La sala</title>
  <link rel="preload" href="fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="gl"></canvas>
  </div>
  <div id="veil"></div>

  <section id="intro">
    <p class="posto" id="posto"></p>
    <h1 id="titolo">Questa sala ha qualcosa da mostrarti.</h1>
    <p class="guida">Consenti l'uso della fotocamera e inquadra il codice davanti a te. Il resto succede da solo.</p>
    <button id="avvia" type="button">Attiva la fotocamera</button>
    <p class="errore" id="errore" role="alert"></p>
  </section>

  <div id="hint" aria-live="polite"></div>
  <div id="conn" data-stato="attesa">In collegamento</div>

  <script src="config.js"></script>
  <script src="vendor/jsQR.js"></script>
  <script src="vendor/mqtt.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
